[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazarus-drill"
version = "0.1.0"
description = "An agent that proves your backups actually restore."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
lazarus = "lazarus.cli:main"

[tool.setuptools.packages.find]
include = ["lazarus*"]
